[env:RAK_3401_asset_beacon_ble]
custom_fw_version = v1.16.0-mw.asset.1
extra_scripts =
  ${nrf52_base.extra_scripts}   ; create-uf2.py (DFU/uf2 packaging) — preserve
  pre:fw_version.py
; Personal asset locator / anti-theft beacon (NOT public coverage mapping). Full
; companion-app + meshmapper compatibility over BLE, PLUS -D AB, which is the
; generic "periodic self-advert + movement gate" engine. Tuned here as a PUSH beacon:
; the node autonomously FLOODS its GPS position into the mesh so any MQTT-uplinked
; observer relays it to your map even when the node is far from your phone (the theft
; case). Movement-gated so it's near-silent parked and beacons while it's on the move.
;   * AB_FLOOD_SECS  max beacon rate while moving (secs). Flood-routed = travels
;                          multiple hops to reach an observer (a stolen node is NOT a
;                          direct neighbour, so zero-hop is useless here -> ZH left 0).
;   * AB_MOVE_M      only beacon after moving this many metres (defeats parked
;                          GPS jitter; this is the anti-theft trigger).
;   * AB_IDLE_SECS   heartbeat: force a beacon after this long stationary, so a
;                          parked node still shows "alive + here" on the map.
;   * user button          = one manual flood beacon on demand ("where is it now").
;   * boot                 = a beacon ~30s after power-up (a thief power-cycling it
;                          gives you a fresh fix/ping).
; No-fix safe: if GPS has no fix the beacon goes out name-only (no false 0,0 position)
; so an observer that hears it still tells you the rough area. Forces GPS on +
; location-share. All settable from the app (custom vars ab/ab_zh/ab_flood/ab_move/
; ab_idle) and USB serial (set ab 1 / set ab_flood 120 / set ab_move 30 / set ab_idle 1800).
;
; GPS NOTE (see memory reference_rak3401_1w_device): the 1W's GPS is a RAK12501
; (Quectel L76K), UART-ONLY on Serial1 -> it MUST sit in WisBlock SLOT A, and it
; relies on the fixed initBasicGPS() setPins(RX,TX) order (local-patches/
; rak3401-gps-uart-setpins-fix.patch -- re-apply after any git pull). This build
; uses the stock UART/NMEA path (NOT the reverted u-blox/I2C/RAK_BOARD attempt) and
; adds -D ENV_SKIP_GPS_DETECT so a slow cold-start can't leave GPS off (module known-present).
; TIP: give the node an innocuous name (not "TRACKER") so a thief doesn't clock it.
extends = rak3401
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${rak3401.build_flags}
  -I examples/companion_radio/ui-new
  -D PIN_USER_BTN_ANA=31
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D AB
  -D AB_DEFAULT_ENABLED=1
  -D AB_ZH_SECS=0        ; zero-hop off: useless for a node that's not a direct neighbour
  -D AB_FLOOD_SECS=120   ; flood a fresh position at most every 2min WHILE MOVING
  -D AB_MOVE_M=30        ; ...only if it moved >=30m (parked GPS jitter won't trip it)
  -D AB_IDLE_SECS=1800   ; parked heartbeat: one beacon every 30min so it stays on the map
  -D ENV_SKIP_GPS_DETECT
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${rak3401.lib_deps}
  densaugeo/base64 @ ~1.4.0
