[rak3401]
extends = nrf52_base
board = rak3401
board_check = true
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/rak3401
  -D RAK_3401
  -D NRF52_POWER_MANAGEMENT
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_REGISTER_PATCH=1       ; Patch register 0x8B5 for improved RX with SKY66122 FEM
build_src_filter = ${nrf52_base.build_src_filter}
  +<../variants/rak3401>
  +<helpers/sensors>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.27

[env:RAK_3401_repeater]
extends = rak3401
build_flags =
  ${rak3401.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"RAK3401 1W Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>

[env:RAK_3401_mqtt_repeater]
; 1W repeater that publishes heard packets to MQTT via a RAK2305 (ESP32 ESP-AT)
; over UART1. No SPI/Ethernet — see memory project_mqtt_repeater for why the
; RAK13800 path is impossible on this Core. The ESP32 carries the TLS/WSS
; stack, so it can reach a wss:// broker on 443 directly (scheme 7/8).
extends = rak3401
build_flags =
  ${rak3401.build_flags}
  ; Serial1 = RAK2305 bridge; keep the GPS reader off it (undef wins over sensor_base)
  -UENV_INCLUDE_GPS
  -I examples/simple_repeater
  -I examples/mqtt_repeater
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"RAK3401 MQTT Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater/MyMesh.cpp>
  +<../examples/simple_repeater/UITask.cpp>
  +<../examples/mqtt_repeater/main.cpp>

[env:RAK_3401_uart_uplink]
custom_fw_version = v1.16.0-mw.uart.2
extra_scripts =
  ${nrf52_base.extra_scripts}   ; create-uf2.py (DFU/uf2 packaging) — preserve
  pre:fw_version.py
; Same 1W repeater as RAK_3401_mqtt_repeater, but the RAK2305 is reflashed with
; NATIVE MeshCore MQTT firmware (agessaman flex bridge) instead of ESP-AT. The
; nRF52 no longer drives AT commands — under -D UART_UPLINK it just forwards each
; heard packet to the ESP32 over Serial1 as a framed line "MCPKT <hex> <snr> <rssi>".
; The ESP32 owns WiFi/NTP/MQTT/JWT, the observer identity, topics, and /status.
; Lets one observer publish to all 3 maps (meshwerks + rflab + meshmapper) at once.
extends = rak3401
build_flags =
  ${rak3401.build_flags}
  ; Serial1 = RAK2305 bridge; keep the GPS reader off it (undef wins over sensor_base)
  -UENV_INCLUDE_GPS
  -I examples/simple_repeater
  -I examples/mqtt_repeater
  -D UART_UPLINK
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"RAK3401 MQTT Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater/MyMesh.cpp>
  +<../examples/simple_repeater/UITask.cpp>
  +<../examples/mqtt_repeater/main.cpp>

[env:RAK_3401_room_server]
extends = rak3401
build_flags =
  ${rak3401.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Test Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  ;-D MESH_PACKET_LOGGING=1
  ;-D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_room_server>

[env:RAK_3401_companion_radio_usb]
extends = rak3401
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${rak3401.build_flags}
  -I examples/companion_radio/ui-new
  -D PIN_USER_BTN_ANA=31
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${rak3401.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:RAK_3401_companion_radio_ble]
extends = rak3401
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
