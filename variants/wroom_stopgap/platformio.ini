; ============================================================================
; TEMPORARY STOPGAP — bare ESP-WROOM-32 dev board standing in for a DEAD RAK2305.
; OSH NODE ONLY. APL + LC keep running the real RAK2305 (RAK2305_uplink_observer).
;
; WHY THIS EXISTS: OSH's RAK2305 died (water damage) and 2305s are out of stock.
; A generic ESP-WROOM-32 (ESP32-D0WDQ6-V3, 4MB, MAC 30:c6:f7:27:7e:8c) fills in.
;
; HOW TO REVERT when a real RAK2305 arrives: flash RAK2305_uplink_observer onto the
; 2305, drop it into OSH's base board in place of the WROOM. The nRF52 side does NOT
; change (it already runs RAK_3401_uart_uplink). Then DELETE this whole folder
; (variants/wroom_stopgap/) — the RAK2305 env is completely untouched by this file.
;
; KEY DIFFERENCE vs the RAK2305 env: WROOM has NO PSRAM, so MQTTBridge caps
; _max_active_slots at 2 (not 5). => at most 2 brokers connect natively. Put the two
; you want in mqtt1/mqtt2; cover the 3rd map via the server-side WSS relay (set
; mqtt3.preset none, or leave it configured knowing it will stay disconnected).
;
; Reuses the shared variants/rak2305 source wholesale (UartRadio, target, GPIO19/21
; UART pins) — only the board + PSRAM flag differ. Everything else (MCSTA stats,
; load-shed `net shed`/`net resume`, JWT, OTA) is identical to the 2305 build.
; ============================================================================

[wroom_stopgap]
extends = esp32_base
board = esp32dev                   ; ESP32-WROOM-32, 4MB, NO PSRAM
board_build.partitions = min_spiffs.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/rak2305              ; reuse the shared UART-uplink variant source
  -I examples/simple_repeater
  -D P_LORA_DIO_1=0                ; no LoRa IRQ; satisfies ESP32Board base refs
  ; deliberately NO -D BOARD_HAS_PSRAM  => psramFound()==false => _max_active_slots=2
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/rak2305>
  +<helpers/*.cpp>
lib_deps =
  ${esp32_base.lib_deps}

[env:WROOM_uplink_observer_TEMP]
extends = wroom_stopgap
extra_scripts =
  ${esp32_base.extra_scripts}
  pre:scripts/generate_cert_bundle.py
board_ssl_cert_source = adafruit-full
board_build.embed_files = src/certs/x509_crt_bundle.bin
build_flags =
  ${wroom_stopgap.build_flags}
  -D ADVERT_NAME='"MESHWERKS_OSH_R01"'   ; OSH-only stopgap; nRF52 re-syncs name via MCNAME anyway
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_MQTT_BRIDGE=1
  -D MAX_MQTT_BROKERS=3
  -D MQTT_MAX_PACKET_SIZE=1024
  -D MQTT_DEBUG=1
  -D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
build_src_filter = ${wroom_stopgap.build_src_filter}
  +<helpers/bridges/MQTTBridge.cpp>
  +<helpers/MQTTMessageBuilder.cpp>
  +<helpers/JWTHelper.cpp>
  +<../examples/simple_repeater/MyMesh.cpp>
  +<../examples/mqtt_uplink/main.cpp>
lib_deps =
  ${wroom_stopgap.lib_deps}
  ${esp32_ota.lib_deps}
  elims/PsychicMqttClient@^0.2.4
  bblanchon/ArduinoJson
  arduino-libraries/NTPClient
  JChristensen/Timezone
  paulstoffregen/Time@1.6.1
