; RAK2305 (ESP32-WROVER) native multi-broker MQTT observer.
; No LoRa radio: packets arrive over UART from a companion RAK3401 (nRF52) built
; with -D UART_UPLINK. Reuses the simple_repeater example wholesale; UartRadio
; (variants/rak2305) presents the UART link through the mesh::Radio interface so
; the standard receive path feeds MQTTBridge. PSRAM (WROVER) => 5 active slots
; => meshwerks + rflab + meshmapper simultaneously.

[rak2305]
extends = esp32_base
board = esp-wrover-kit              ; ESP32-WROVER, PSRAM enabled in board JSON
board_build.partitions = min_spiffs.csv   ; ~1.9MB app + SPIFFS for identity/cfg
build_flags =
  ${esp32_base.build_flags}
  -I variants/rak2305
  -I examples/simple_repeater
  -D BOARD_HAS_PSRAM
  -D P_LORA_DIO_1=0                 ; no LoRa IRQ; satisfies ESP32Board base refs
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/rak2305>
  +<helpers/*.cpp>
lib_deps =
  ${esp32_base.lib_deps}

[env:RAK2305_uplink_observer]
extends = rak2305
custom_fw_version = v1.16.0-mw.wifiobs.1
extra_scripts =
  ${esp32_base.extra_scripts}
  pre:scripts/generate_cert_bundle.py
  pre:fw_version.py
board_ssl_cert_source = adafruit-full
board_build.embed_files = src/certs/x509_crt_bundle.bin
build_flags =
  ${rak2305.build_flags}
  -D ADVERT_NAME='"RAK2305 Observer"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_MQTT_BRIDGE=1
  -D MAX_MQTT_BROKERS=3
  -D MQTT_MAX_PACKET_SIZE=1024
  -D MQTT_DEBUG=1
  -D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
build_src_filter = ${rak2305.build_src_filter}
  +<helpers/bridges/MQTTBridge.cpp>
  +<helpers/MQTTMessageBuilder.cpp>
  +<helpers/JWTHelper.cpp>
  +<../examples/simple_repeater/MyMesh.cpp>
  +<../examples/mqtt_uplink/main.cpp>
lib_deps =
  ${rak2305.lib_deps}
  ${esp32_ota.lib_deps}
  elims/PsychicMqttClient@^0.2.4
  bblanchon/ArduinoJson
  arduino-libraries/NTPClient
  JChristensen/Timezone
  paulstoffregen/Time@1.6.1
