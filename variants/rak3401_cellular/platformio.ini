; RAK3401 (nRF52840 + 1W SKY66122 PA) single-chip LTE-M MQTT observer.
; Drives a RAK5860 (Quectel BG77) on Serial1 via AT commands — no ESP32, no WiFi.
; Reuses the [rak3401] base defined in variants/rak3401/platformio.ini (also auto-included
; by the root extra_configs = variants/*/platformio.ini), so we do NOT redefine it here.
;
; Publishes to a single broker (your Mosquitto) over mqtts:8883 using the BG77's onboard
; TLS + MQTT client. Config via `set cell.*` (see src/helpers/CommonCLI.cpp).

[env:RAK_3401_cellular_observer]
extends = rak3401
; chain+ evaluates #ifdef so the LDF does NOT follow the WITH_MQTT_BRIDGE-guarded
; MQTTBridge.h include in AlertReporter.h (which would drag in the ESP-only
; PsychicMqttClient / WiFi / mqtt_client.h libs).
lib_ldf_mode = chain+
; Fleet version reported by `ver` / the app / MQTT status: <base>-<fleet>.<variant>.<rev>;
; fw_version.py appends +g<githash>. Bump the .rev on each meaningful change (see VERSIONS.md).
custom_fw_version = v1.17.0-mw.cell.3
extra_scripts =
  ${nrf52_base.extra_scripts}   ; create-uf2.py (DFU/uf2 packaging) — must be preserved
  pre:fw_version.py
build_flags =
  ${rak3401.build_flags}
  -UENV_INCLUDE_GPS                 ; free Serial1 for the modem (no NMEA GPS)
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"RAK3401 Cellular Observer"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_CELLULAR_MQTT_BRIDGE=1
  -D CELLULAR_UART=Serial1
  -D CELLULAR_UART_RX=PIN_SERIAL1_RX   ; P0.15
  -D CELLULAR_UART_TX=PIN_SERIAL1_TX   ; P0.16
  -D CELLULAR_UART_BAUD=115200
  ; RAK5860 WIS_PWRKEY = WB_IO1 = P0.17 (RAK datasheet). BG77 is off by default; driving
  ; WIS_PWRKEY HIGH ~600 ms boots it (BG77Modem::powerPulse). The IO-slot 3V3_S rail is
  ; already held on by the board (PIN_3V3_EN/WB_IO2), so no separate power-enable is needed.
  -D CELLULAR_PWRKEY_PIN=17
  -D CELLULAR_POWER_EN_PIN=-1
  -D CELLULAR_STATUS_PIN=-1
  ; Echo all modem AT traffic to USB Serial + enable the `at <cmd>` CLI passthrough for
  ; bring-up. Remove this flag for headless/solar deployment.
  -D CELLULAR_AT_DEBUG=1
build_src_filter = ${rak3401.build_src_filter}
  -<../variants/rak3401/target.cpp>            ; replaced by our target.cpp (adds gettimeofday)
  -<helpers/JWTHelper.cpp>                     ; ESP-only (mbedtls); cellular uses no JWT
  +<../variants/rak3401_cellular/target.cpp>
  +<helpers/MQTTMessageBuilder.cpp>            ; excluded by arduino_base; the cellular bridge uses it
  +<helpers/bridges/CellularMQTTBridge.cpp>
  +<helpers/cellular/BG77Modem.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${rak3401.lib_deps}
  bblanchon/ArduinoJson
  JChristensen/Timezone
  paulstoffregen/Time@1.6.1
